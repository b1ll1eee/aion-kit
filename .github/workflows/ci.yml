name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzParseKey -fuzztime=10s ./idempotency
          go test -run='^$' -fuzz=FuzzDecodeResponse -fuzztime=10s ./idempotency
